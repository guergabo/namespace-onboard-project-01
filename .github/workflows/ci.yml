name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button in the Actions tab.
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: namespace-profile-linux-basic
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The glossary is read from SQLite at build time, and the database is not committed.
      - name: Create and seed the database
        run: npm run db:setup

      - run: npm run lint

      - name: Typecheck
        run: npx next typegen && npm run typecheck

      - name: Unit tests
        run: npm test

      - run: npm run build

      # Starts the production build and drives it in Chromium (see playwright.config.ts).
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
