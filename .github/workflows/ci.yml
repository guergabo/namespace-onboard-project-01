name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button in the Actions tab.
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: namespace-profile-linux-basic
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # GitHub's npm cache is off: npm's downloads and Playwright's browsers are kept on the runner
      # profile's Namespace cache volume instead, so nothing is downloaded or uploaded per run.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      - name: Cache npm packages and Playwright browsers
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: |
            npm
            playwright

      - run: npm ci

      # The glossary is read from SQLite at build time, and the database is not committed.
      - name: Create and seed the database
        run: npm run db:setup

      - run: npm run lint

      - name: Typecheck
        run: npx next typegen && npm run typecheck

      - name: Unit tests
        run: npm test

      - run: npm run build

      # Starts the production build and drives it in Chromium (see playwright.config.ts).
      - name: Install Chromium for Playwright
        run: npx playwright install --with-deps chromium

      - name: Browser tests
        run: npm run test:e2e

      # Namespace runners build on Remote Builders and are already logged in to the workspace's
      # private registry (nscr.io), whose address is in NSC_CONTAINER_REGISTRY. Pull requests only
      # build the image; main pushes it.
      - name: Build and push the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ env.NSC_CONTAINER_REGISTRY }}/tendu:${{ github.sha }}
            ${{ env.NSC_CONTAINER_REGISTRY }}/tendu:latest

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
