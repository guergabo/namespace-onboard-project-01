name: CI

on:
  push:
    branches: [main]
  pull_request:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      # The glossary is read from SQLite at build time, and the database is not committed.
      - name: Create and seed the database
        run: npm run db:setup

      - run: npm run lint

      - name: Typecheck
        run: npx next typegen && npm run typecheck

      - run: npm run build

      # Start the production build and check that key pages render with their content.
      - name: Smoke test
        run: |
          npm start -- -p 3000 > server.log 2>&1 &
          for i in $(seq 1 30); do curl -fs -o /dev/null http://localhost:3000/ && break; sleep 1; done
          check() {
            page=$(curl -fsS "http://localhost:3000$1") && grep -qF "$2" <<< "$page" || { echo "FAIL: $1 is missing \"$2\""; cat server.log; exit 1; }
            echo "ok: $1"
          }
          check / "tendu"
          check /glossary "Basic conceptions"
          check /glossary/croise-derriere "Croisé derrière"
          check /glossary/battement-tendu "Working leg"
