name: CI

on:
  push:
    branches: [main]
  pull_request:
  # Adds a "Run workflow" button in the Actions tab.
  workflow_dispatch:

# A newer push to the same branch or pull request cancels the run still in progress.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    name: Build and test
    runs-on: namespace-profile-linux-basic
    timeout-minutes: 15
    env:
      NEXT_TELEMETRY_DISABLED: 1
    steps:
      - uses: actions/checkout@v7

      # GitHub's npm cache is off: npm's downloads are kept on the runner profile's Namespace cache
      # volume instead, so nothing is downloaded or uploaded per run.
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          package-manager-cache: false

      # Not `playwright`: the cache volume would be mounted over ~/.cache/ms-playwright and hide
      # the browsers baked into the base image.
      - name: Cache npm packages
        uses: namespacelabs/nscloud-cache-action@v1
        with:
          cache: npm

      - run: npm ci

      # The glossary is read from SQLite at build time, and the database is not committed.
      - name: Create and seed the database
        run: npm run db:setup

      - run: npm run lint

      - name: Typecheck
        run: npx next typegen && npm run typecheck

      - name: Unit tests
        run: npm test

      - run: npm run build

      # Chromium's headless shell and its system libraries are baked into the runner profile's
      # custom base image (Dockerfile in the Namespace dashboard) for Playwright 1.64.1, so this is
      # a no-op; after a Playwright bump it downloads the new shell until the image is updated.
      # No --with-deps: that runs apt-get on every run. --only-shell: the tests run headless, so
      # the full Chromium isn't needed.
      - name: Install Chromium for Playwright
        run: npx playwright install --only-shell chromium

      # Starts the production build and drives it in Chromium (see playwright.config.ts).
      - name: Browser tests
        run: npm run test:e2e

      # The workspace's private registry (nscr.io). Namespace's standard runner image sets
      # NSC_CONTAINER_REGISTRY and logs Docker in to it; the profile's custom base image doesn't, so
      # this logs in when needed and gives the registry's address either way.
      - name: Log in to the Namespace registry
        id: nscloud
        uses: namespacelabs/nscloud-setup@v0

      # Namespace runners build on Remote Builders. Pull requests only build the image; main pushes it.
      - name: Build and push the Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          push: ${{ github.event_name != 'pull_request' }}
          tags: |
            ${{ steps.nscloud.outputs.registry-address }}/tendu:${{ github.sha }}
            ${{ steps.nscloud.outputs.registry-address }}/tendu:latest

      - name: Upload Playwright traces
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-traces
          path: test-results/
          retention-days: 7
